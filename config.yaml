schema_version: 2
software:
  venv: ~/.venvs/vllm
  modules: [gcc/13.1.0, cuda13.0/toolkit/13.0.2]
  cuda_home: /cm/shared/apps/cuda13.0/toolkit/13.0.2
  versions: {ai-dynamo: 1.5.0, vllm: 0.28.0, nixl: 1.3.2}
  etcd: ~/.local/bin/etcd
  nats: ~/.local/bin/nats-server
  control_versions: {etcd: v3.7.2, nats: v2.15.1}
models:
  dense:
    path: ~/models/qwen3.6-27b
    served_name: qwen3.6-27b
  moe:
    path: ~/models/qwen3.6-35b-a3b
    served_name: qwen3.6-35b-a3b
engine:
  dtype: bfloat16
  gpu_memory_utilization: 0.88
  max_model_len: 32768
  max_num_seqs: 32
  max_num_batched_tokens: 8192
  speculative_method: mtp
  speculative_tokens: 3
  speculative_model: null
  # For Qwen3.8 DFlash2, point models.dense.path at the full target checkpoint,
  # then use: speculative_method: dflash, speculative_tokens: 7,
  # speculative_model: z-lab/Qwen3.8-27B-DFlash2
  prefix_caching: true
  gdn_prefill_backend: flashinfer
  # Candidate adapters remain selectable; their incremental cross-node/MTP gain is not yet verified.
  kernels: custom
frontend:
  port: 19000
  router_mode: kv
control:
  etcd_port: 23790
  etcd_peer_port: 23791
  nats_port: 42220
  startup_timeout: 1200
transport:
  # Leave UCX device/transport selection to the runtime until topology is measured.
  environment: {}
fabric:
  target_utilization: 0.8
  # 'local' pins each worker to the HCA attached to its GPU, using
  # nvidia-smi topo -m; a worker with no locally attached HCA falls back to
  # 'all'. Override per deployment with transport.environment.
  hca_selection: local
  kv_bytes_per_element: 2
  recurrent_bytes_per_element: 4
  conv_bytes_per_element: 2
recipes:
  initial-h100:
    model: dense
    control_node: g001
    # Existing user-owned allocations; refresh these IDs before a later run.
    allocations: {g001: 1209720, g003: 1209721, g004: 1209722}
    workers:
      - {name: prefill, role: prefill, node: g003, tp: 1, system_port: 18082, nixl_port: 15600, event_port: 29080}
      - {name: decode, role: decode, node: g004, tp: 1, system_port: 18081, nixl_port: 15601}
  initial-h200:
    model: dense
    control_node: b005
    # Two-H200 example on one node; refresh allocation IDs before a later run.
    allocations: {b005: 1210736, g212: 1210692}
    # CPU/NUMA placement is automatic within the allocation.
    # Optional overrides: cpus_per_task (CPU affinity cap), numa_node (host-specific).
    workers:
      - {name: prefill, role: prefill, node: g212, gpu_ids: [0], tp: 1, system_port: 18082, nixl_port: 15600, event_port: 29080}
      - {name: decode, role: decode, node: g212, gpu_ids: [1], tp: 1, system_port: 18081, nixl_port: 15601}
  initial-h200-pool:
    model: dense
    control_node: b005
    # Live layout: one single-GPU prefill on g211 feeding four single-GPU decode
    # replicas, two in each of the two 2-GPU g212 allocations. Every worker is
    # tp=1, so no worker spans two allocations and no NVLink pair is required.
    # Refresh the job IDs when these allocations expire.
    allocations:
      b005: 1210863
      g211: 1210849
      g212-a: {node: g212, job: 1210870}
      g212-b: {node: g212, job: 1210838}
    workers:
      - {name: prefill, role: prefill, allocation: g211, tp: 1, system_port: 18080, nixl_port: 15600, event_port: 29080}
      - {name: decode-1, role: decode, allocation: g212-a, gpu_ids: [0], tp: 1, system_port: 18081, nixl_port: 15601}
      - {name: decode-2, role: decode, allocation: g212-a, gpu_ids: [1], tp: 1, system_port: 18082, nixl_port: 15602}
      - {name: decode-3, role: decode, allocation: g212-b, gpu_ids: [0], tp: 1, system_port: 18083, nixl_port: 15603}
      - {name: decode-4, role: decode, allocation: g212-b, gpu_ids: [1], tp: 1, system_port: 18084, nixl_port: 15604}
  heterogeneous:
    model: dense
    control_node: null
    allocations: {}
    workers: []
